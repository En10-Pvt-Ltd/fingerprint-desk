# SPDX-License-Identifier: Apache-2.0
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Docker deployments are network deployments: always server mode
      # (email+password accounts; first visit runs the one-time setup).
      FF_MODE: "server"
      FF_MAX_VARIANTS: "5"
      # The app port is never published (only Caddy is), so the immediate
      # peer is always Caddy: trust its X-Forwarded-For for per-client
      # rate-limit buckets.
      FF_TRUST_PROXY: "1"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      # Caddy serves at BASE_URL; its scheme selects plain HTTP (localhost)
      # vs automatic HTTPS (a real https:// domain). See Caddyfile.
      BASE_URL: ${BASE_URL:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
